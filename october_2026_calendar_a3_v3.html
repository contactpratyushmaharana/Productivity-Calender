<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>October 2026 Wall Calendar - A3</title>
    <style>
        @page {
            size: A3 landscape; /* 420mm x 297mm */
            margin: 15mm;
            background-color: #fdfaf6;
            @bottom-right { content: none !important; }
            @bottom-center { content: none !important; }
            @bottom-left { content: none !important; }
            @top-right { content: none !important; }
            @top-center { content: none !important; }
            @top-left { content: none !important; }
        }

        *, *::before, *::after {
            box-sizing: border-box;
        }

        body {
            font-family: 'Georgia', 'Helvetica Neue', serif;
            margin: 0;
            padding: 0;
            color: #4a2e1b;
            background-color: #fdfaf6;
            height: 100%;
            position: relative;
        }

        /* Subtle Autumn Leaf / Warm Vignette Background Overlay */
        .autumn-bg {
            position: absolute;
            top: -15mm;
            left: -15mm;
            right: -15mm;
            bottom: -15mm;
            z-index: -1;
            background-image: 
                radial-gradient(circle at 90% 10%, rgba(217, 119, 6, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 10% 90%, rgba(180, 83, 9, 0.08) 0%, transparent 45%),
                radial-gradient(circle at 50% 50%, rgba(254, 243, 199, 0.3) 0%, transparent 100%);
        }

        .container {
            width: 100%;
            height: 100%;
            position: relative;
            z-index: 1;
        }

        /* Header Layout */
        .header-table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 10px;
        }

        .header-title {
            font-size: 32pt;
            font-weight: 800;
            letter-spacing: 3px;
            color: #78350f; /* Deep Amber / Warm Terracotta */
            text-transform: uppercase;
            padding: 0;
            margin: 0;
            line-height: 1;
            font-family: 'Helvetica Neue', Arial, sans-serif;
        }

        .top-quote {
            font-size: 12pt;
            font-style: italic;
            color: #92400e;
            padding: 0;
            line-height: 1.3;
        }

        /* Main Grid Table: Sidebar + Calendar */
        .main-layout {
            width: 100%;
            border-collapse: collapse;
            table-layout: fixed;
        }

        .sidebar-col {
            width: 25%;
            vertical-align: top;
            padding-right: 15px;
        }

        .calendar-col {
            width: 75%;
            vertical-align: top;
        }

        /* Sidebar Styling */
        .sidebar-card {
            background-color: rgba(255, 255, 255, 0.85);
            border: 1.5px solid #d97706;
            border-radius: 8px;
            padding: 10px 14px;
            margin-bottom: 12px;
            box-shadow: 0 2px 6px rgba(120, 53, 15, 0.05);
        }

        .sidebar-card-title {
            font-size: 13pt;
            font-weight: 700;
            color: #78350f;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-bottom: 2px solid #fde68a;
            padding-bottom: 4px;
            margin-bottom: 6px;
            font-family: 'Helvetica Neue', Arial, sans-serif;
        }

        /* Habit Tracker Key */
        .tracker-key {
            margin-top: 4px;
        }

        .key-item {
            font-size: 10pt;
            color: #78350f;
            margin-bottom: 6px;
            font-family: 'Helvetica Neue', Arial, sans-serif;
            display: table;
            width: 100%;
        }

        .key-icon-cell {
            display: table-cell;
            width: 24px;
            vertical-align: middle;
        }

        .key-label-cell {
            display: table-cell;
            vertical-align: middle;
            font-weight: 600;
        }

        .tracker-svg {
            width: 16px;
            height: 16px;
            vertical-align: middle;
        }

        .line-notes {
            border-bottom: 1px dashed #f59e0b;
            height: 20px;
            margin-top: 4px;
            opacity: 0.6;
        }

        /* Calendar Grid Table */
        .calendar-table {
            width: 100%;
            border-collapse: collapse;
            table-layout: fixed;
            background-color: rgba(255, 255, 255, 0.9);
            border-radius: 8px;
            overflow: hidden;
            border: 1.5px solid #d97706;
        }

        .calendar-table th {
            background-color: #78350f; /* Rust / Warm Sienna */
            color: #fef3c7;
            font-size: 13pt;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            padding: 8px 0;
            text-align: center;
            width: 14.28%;
            font-family: 'Helvetica Neue', Arial, sans-serif;
        }

        .calendar-table td {
            border: 1px solid #fde68a;
            height: 38mm;
            vertical-align: top;
            padding: 6px 8px;
            position: relative;
            background-color: rgba(255, 255, 255, 0.7);
        }

        .calendar-table td.other-month {
            background-color: #fffbe2;
            opacity: 0.7;
        }

        .day-num {
            font-size: 15pt;
            font-weight: 700;
            color: #4a2e1b;
            text-align: right;
            font-family: 'Helvetica Neue', Arial, sans-serif;
            margin-bottom: 4px;
        }

        .day-num.muted {
            color: #d97706;
            opacity: 0.5;
        }

        /* Habit Symbols Grid in Day Cells */
        .habit-icons {
            position: absolute;
            bottom: 6px;
            left: 6px;
            right: 6px;
            text-align: left;
            line-height: 1;
        }

        .habit-symbol {
            display: inline-block;
            margin-right: 4px;
        }

        .habit-symbol svg {
            width: 15px;
            height: 15px;
        }
    </style>
</head>
